services:
  mysql:
    image: docker.io/library/mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: grafana_perf
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 30

  verifier:
    build:
      context: .
      dockerfile: Dockerfile.perf-verifier
    volumes:
      - ./:/workspace:Z
    depends_on:
      mysql:
        condition: service_healthy
